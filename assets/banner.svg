<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2F" />
      <stop offset="100%" stop-color="#3A3A5A" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1000" height="250" fill="url(#bg)" rx="15" ry="15" />
  
  <circle cx="150" cy="125" r="40" fill="#5F5FFF" opacity="0.3">
    <animate attributeName="r" values="30;50;30" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="125" r="40" fill="#FF5F5F" opacity="0.3">
    <animate attributeName="r" values="50;30;50" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <text x="500" y="115" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Awesome Video Annotation Platform
  </text>
  
  <text x="500" y="165" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#E0E0E0" text-anchor="middle">
    Curated SaaS &amp; Open-Source ecosystem for video labeling
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </text>
</svg>
